<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111318">
  <title>Sheet Music</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <section id="libraryView" class="view library-view is-active" aria-labelledby="libraryTitle">
      <header class="library-header">
        <div>
          <h1 id="libraryTitle">Sheet Music</h1>
          <p class="subtitle">Your personal music library</p>
        </div>
        <button id="importButton" class="button button-primary" type="button">Import PDF</button>
        <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple hidden>
      </header>

      <p id="libraryMessage" class="message" role="status" aria-live="polite"></p>
      <div id="emptyLibrary" class="empty-state">
        <p>Your library is empty.</p>
        <p>Import a PDF from the Files app to get started.</p>
      </div>
      <ul id="pdfList" class="pdf-list" aria-label="Sheet music library"></ul>
    </section>

    <section id="readerView" class="view reader-view" aria-label="PDF reader" aria-hidden="true">
      <div id="pageContainer" class="page-container">
        <canvas id="pdfCanvas" aria-label="Current sheet music page"></canvas>
        <canvas id="inkCanvas" aria-hidden="true"></canvas>
      </div>
      <button id="previousZone" class="tap-zone tap-zone-left" type="button" aria-label="Previous page"></button>
      <button id="nextZone" class="tap-zone tap-zone-right" type="button" aria-label="Next page"></button>
      <button id="centerZone" class="tap-zone tap-zone-center" type="button" aria-label="Show or hide toolbar"></button>

      <header id="readerToolbar" class="reader-toolbar">
        <button id="backButton" class="button" type="button">Library</button>
        <div id="readerTitle" class="reader-title"></div>
        <button id="annotationToggle" class="button annotation-toggle" type="button" aria-pressed="false">Annotate</button>
        <div class="page-controls">
          <button id="previousButton" class="button icon-button" type="button" aria-label="Previous page">‹</button>
          <span id="pageLabel" aria-live="polite">— / —</span>
          <button id="nextButton" class="button icon-button" type="button" aria-label="Next page">›</button>
        </div>
      </header>
      <div id="annotationToolbar" class="annotation-toolbar" role="toolbar" aria-label="Annotation tools" hidden>
        <div class="annotation-tool-group" role="group" aria-label="Drawing tool">
          <button class="annotation-tool-button is-selected" type="button" data-annotation-tool="pen" aria-pressed="true">Pen</button>
          <button class="annotation-tool-button" type="button" data-annotation-tool="highlighter" aria-pressed="false">Highlight</button>
          <button class="annotation-tool-button" type="button" data-annotation-tool="eraser" aria-pressed="false">Eraser</button>
        </div>
        <div class="annotation-color-group" role="group" aria-label="Ink color">
          <button class="annotation-color-button is-selected" type="button" data-ink-color="#17191f" aria-label="Black ink" aria-pressed="true"><span class="color-swatch swatch-black"></span></button>
          <button class="annotation-color-button" type="button" data-ink-color="#e34d59" aria-label="Red ink" aria-pressed="false"><span class="color-swatch swatch-red"></span></button>
          <button class="annotation-color-button" type="button" data-ink-color="#3485e4" aria-label="Blue ink" aria-pressed="false"><span class="color-swatch swatch-blue"></span></button>
          <button class="annotation-color-button" type="button" data-ink-color="#37a56b" aria-label="Green ink" aria-pressed="false"><span class="color-swatch swatch-green"></span></button>
          <button class="annotation-color-button" type="button" data-ink-color="#f09a38" aria-label="Orange ink" aria-pressed="false"><span class="color-swatch swatch-orange"></span></button>
        </div>
        <label class="annotation-width-control" for="annotationWidth">
          Size <output id="annotationWidthValue">4 px</output>
          <input id="annotationWidth" type="range" min="1" max="24" step="1" value="4">
        </label>
        <div class="annotation-history-group" role="group" aria-label="Annotation history">
          <button id="annotationUndo" class="annotation-action-button" type="button" aria-label="Undo" disabled>Undo</button>
          <button id="annotationRedo" class="annotation-action-button" type="button" aria-label="Redo" disabled>Redo</button>
          <button id="annotationClear" class="annotation-action-button" type="button">Clear page</button>
        </div>
        <label class="finger-drawing-control" for="allowFingerDrawing">
          <input id="allowFingerDrawing" type="checkbox">
          Allow finger drawing
        </label>
        <p id="annotationMessage" class="annotation-message" role="status" aria-live="polite"></p>
      </div>
      <details id="metronomePanel" class="metronome-panel">
        <summary class="metronome-summary">
          <span>Metronome</span>
          <span id="metronomeStatus" class="metronome-status">Stopped</span>
        </summary>
        <div class="metronome-controls">
          <div class="tempo-row">
            <label class="tempo-label" for="bpmSlider">Tempo <output id="bpmValue">96 BPM</output></label>
            <div class="tempo-adjust">
              <button id="bpmDown" class="tempo-adjust-button" type="button" aria-label="Decrease tempo">−</button>
              <input id="bpmSlider" type="range" min="30" max="300" step="1" value="96" aria-label="Tempo, beats per minute">
              <button id="bpmUp" class="tempo-adjust-button" type="button" aria-label="Increase tempo">+</button>
            </div>
          </div>

          <div class="metronome-row">
            <button id="metronomeToggle" class="button button-primary metronome-toggle" type="button">Start</button>
            <button id="tapTempo" class="button tap-tempo-button" type="button">Tap tempo</button>
            <span id="beatIndicator" class="beat-indicator" aria-label="Beat indicator"></span>
          </div>

          <label class="setting-label" for="timeSignature">Time signature</label>
          <div class="signature-row">
            <select id="timeSignature">
              <option value="2/4">2/4</option>
              <option value="3/4">3/4</option>
              <option value="4/4" selected>4/4</option>
              <option value="5/4">5/4</option>
              <option value="6/8">6/8</option>
              <option value="custom">Custom</option>
            </select>
            <label id="customBeatsField" class="custom-beats-field" for="customBeats" hidden>
              Beats
              <input id="customBeats" type="number" min="1" max="16" step="1" value="4" inputmode="numeric">
            </label>
          </div>

          <label class="setting-label volume-label" for="metronomeVolume">
            Volume <output id="volumeValue">70%</output>
          </label>
          <input id="metronomeVolume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Metronome volume">
          <p id="metronomeMessage" class="metronome-message" role="status" aria-live="polite"></p>
        </div>
      </details>
      <p id="readerMessage" class="reader-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
